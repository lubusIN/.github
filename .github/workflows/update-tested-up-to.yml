name: Reusable Tested Up To Update

on:
  workflow_call:
    inputs:
      plugin-slug:
        description: "WordPress.org plugin slug. Defaults to the repository name."
        required: false
        type: string
        default: ""
      release-branch:
        description: "Branch whose readme.txt should be tested and updated."
        required: false
        type: string
        default: main
      run-javascript-checks:
        description: "Run lint:js, lint:css, and test:unit before updating."
        required: false
        type: boolean
        default: false
      run-e2e:
        description: "Install Chromium and run the test:e2e script before updating."
        required: false
        type: boolean
        default: false
    secrets:
      SVN_USERNAME:
        description: "WordPress.org SVN username"
        required: true
      SVN_PASSWORD:
        description: "WordPress.org SVN password"
        required: true

permissions:
  contents: read

concurrency:
  group: update-tested-up-to-${{ github.repository }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Check WordPress versions
    runs-on: ubuntu-latest
    outputs:
      latest-version: ${{ steps.versions.outputs.latest-version }}
      source-sha: ${{ steps.versions.outputs.source-sha }}
      update-repository: ${{ steps.versions.outputs.update-repository }}
      update-wordpress-org: ${{ steps.versions.outputs.update-wordpress-org }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}

      - name: Compare tested versions
        id: versions
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug != '' && inputs.plugin-slug || github.event.repository.name }}
        shell: bash
        run: |
          set -euo pipefail

          latest_full=$(curl --fail --silent --show-error --retry 3 \
            "https://api.wordpress.org/core/version-check/1.7/?channel=stable" \
            | jq -er '.offers[0].current')
          latest_version=$(sed -E 's/^([0-9]+\.[0-9]+).*/\1/' <<< "$latest_full")
          repository_version=$(sed -nE \
            's/^Tested up to:[[:space:]]*([0-9]+\.[0-9]+).*$/\1/p' \
            readme.txt)
          wordpress_org_full=$(curl --fail --silent --show-error --retry 3 \
            --get "https://api.wordpress.org/plugins/info/1.2/" \
            --data-urlencode "action=plugin_information" \
            --data-urlencode "request[slug]=$PLUGIN_SLUG" \
            | jq -er '.tested')
          wordpress_org_version=$(sed -E 's/^([0-9]+\.[0-9]+).*/\1/' \
            <<< "$wordpress_org_full")

          for version in "$latest_version" "$repository_version" "$wordpress_org_version"; do
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid WordPress version: $version"
              exit 1
            fi
          done

          if [ "$(printf '%s\n%s\n' "$latest_version" "$repository_version" | sort -V | tail -n 1)" = "$repository_version" ] \
            && [ "$latest_version" != "$repository_version" ]; then
            echo "Repository Tested up to ($repository_version) is newer than the latest stable WordPress release ($latest_version)."
            exit 1
          fi

          update_repository=false
          update_wordpress_org=false

          if [ "$repository_version" != "$latest_version" ]; then
            update_repository=true
          fi

          if [ "$wordpress_org_version" != "$latest_version" ]; then
            update_wordpress_org=true
          fi

          echo "Latest stable WordPress: $latest_version"
          echo "Repository Tested up to: $repository_version"
          echo "WordPress.org Tested up to: $wordpress_org_version"
          echo "latest-version=$latest_version" >> "$GITHUB_OUTPUT"
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "update-repository=$update_repository" >> "$GITHUB_OUTPUT"
          echo "update-wordpress-org=$update_wordpress_org" >> "$GITHUB_OUTPUT"

  compatibility:
    name: Test with latest WordPress
    needs: inspect
    if: >-
      needs.inspect.outputs.update-repository == 'true' ||
      needs.inspect.outputs.update-wordpress-org == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare plugin build
        uses: lubusIN/.github/.github/actions/prepare-build@main
        with:
          checkout-ref: ${{ needs.inspect.outputs.source-sha }}
          fetch-depth: 0
          setup-wp-cli: "true"

      - name: Run JavaScript checks
        if: inputs.run-javascript-checks
        run: |
          npm run lint:js
          npm run lint:css
          npm run test:unit -- --runInBand

      - name: Build release package
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug != '' && inputs.plugin-slug || github.event.repository.name }}
        run: |
          wp dist-archive . "./${PLUGIN_SLUG}.zip"
          mkdir -p tmp-build
          unzip -q "${PLUGIN_SLUG}.zip" -d tmp-build

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./tmp-build/${{ inputs.plugin-slug != '' && inputs.plugin-slug || github.event.repository.name }}
          wp-version: latest

      - name: Install Chromium
        if: inputs.run-e2e
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: inputs.run-e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          WP_BASE_URL: http://localhost:8880
        run: npm run test:e2e

      - name: Upload end-to-end test artifacts
        if: failure() && inputs.run-e2e
        uses: actions/upload-artifact@v4
        with:
          name: tested-up-to-e2e-artifacts
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Stop the WordPress test environment
        if: always()
        run: command -v wp-env >/dev/null && wp-env stop || true

  update:
    name: Update Git and WordPress.org
    needs:
      - inspect
      - compatibility
    if: >-
      always() &&
      needs.compatibility.result == 'success' &&
      (needs.inspect.outputs.update-repository == 'true' ||
      needs.inspect.outputs.update-wordpress-org == 'true')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.source-sha }}
          fetch-depth: 0

      - name: Ensure the release branch has not changed
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          SOURCE_SHA: ${{ needs.inspect.outputs.source-sha }}
        shell: bash
        run: |
          git fetch origin "$RELEASE_BRANCH"
          if [ "$(git rev-parse "origin/${RELEASE_BRANCH}")" != "$SOURCE_SHA" ]; then
            echo "The ${RELEASE_BRANCH} branch changed while compatibility tests were running. Run the workflow again."
            exit 1
          fi

      - name: Update readme and commit
        if: needs.inspect.outputs.update-repository == 'true'
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          VERSION: ${{ needs.inspect.outputs.latest-version }}
        shell: bash
        run: |
          set -euo pipefail

          sed -i -E "s/^(Tested up to:[[:space:]]*).*/\1${VERSION}/" readme.txt
          grep -Eq "^Tested up to:[[:space:]]*${VERSION}$" readme.txt
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.txt
          git commit -m "chore: update tested up to version to ${VERSION}"
          git push origin "HEAD:${RELEASE_BRANCH}"

      - name: Update WordPress.org readme
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ${{ inputs.plugin-slug != '' && inputs.plugin-slug || github.event.repository.name }}
          IGNORE_OTHER_FILES: true
          SKIP_ASSETS: true

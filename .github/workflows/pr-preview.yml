name: Reusable WordPress Playground Preview

on:
  workflow_call:
    inputs:
      landing-page:
        description: 'Landing page path for WordPress Playground. Defaults to /wp-admin/post.php?post=4&action=edit.'
        required: false
        type: string
        default: '/wp-admin/post.php?post=4&action=edit'
      mode:
        description: 'Where to post preview links: "description" (default) or "comment".'
        required: false
        type: string
        default: 'description'
      append-to-pr-description:
        description: 'Deprecated: Use `mode` instead.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_BUILD_BRANCH: playground-${{ github.event.pull_request.number }}
  PR_BUILD_ZIP: pr-build-${{ github.event.pull_request.number }}.zip
  GIT_USER_NAME: "GitHub Action"
  GIT_USER_EMAIL: "action@github.com"
  STORAGE_METHOD: ${{ github.event.repository.private == true && 'r2' || 'branch' }}
  CLOUDFLARE_R2_BUCKET_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_BUCKET_PUBLIC_URL }}

jobs:
  build-and-preview:
    if: github.event.action != 'closed'
    name: Build and Generate Playground Preview
    runs-on: ubuntu-latest

    steps:
      - name: Prepare build
        uses: lubusIN/.github/.github/actions/prepare-build@main
        with:
          checkout-ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Log detected repository type and storage method
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Is Private: ${{ github.event.repository.private }}"
          echo "Storage Method: ${{ env.STORAGE_METHOD }}"

      - name: Setup branch storage
        if: env.STORAGE_METHOD == 'branch'
        uses: lubusIN/.github/.github/actions/publish-build-branch@main
        with:
          target-branch: ${{ env.PR_BUILD_BRANCH }}
          paths: |
            build
            vendor
          commit-message: Add build files for playground preview
          git-user-name: ${{ env.GIT_USER_NAME }}
          git-user-email: ${{ env.GIT_USER_EMAIL }}

      - name: Setup R2 storage
        if: env.STORAGE_METHOD == 'r2'
        run: |
          zip -r "$PR_BUILD_ZIP" . -x "node_modules/*" ".git/*" ".github/*"
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto
          aws configure set default.output json
        env:
          AWS_EC2_METADATA_DISABLED: true

      - name: Upload to R2
        if: env.STORAGE_METHOD == 'r2'
        run: |
          ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="${{ secrets.CLOUDFLARE_R2_BUCKET }}"
          if aws s3api head-object --bucket "$BUCKET" --key "$PR_BUILD_ZIP" --endpoint-url "$ENDPOINT" 2>/dev/null; then
            echo "File exists. Deleting..."
            aws s3 rm "s3://$BUCKET/$PR_BUILD_ZIP" --endpoint-url "$ENDPOINT"
          fi
          aws s3 cp "$PR_BUILD_ZIP" "s3://$BUCKET/$PR_BUILD_ZIP" --endpoint-url "$ENDPOINT"

      - name: Post or update preview
        uses: actions/github-script@v9
        env:
          LANDING_PAGE: ${{ inputs.landing-page }}
          PREVIEW_MODE: ${{ inputs.mode }}
          APPEND_TO_PR_DESCRIPTION: ${{ inputs.append-to-pr-description }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const storageMethod = process.env.STORAGE_METHOD;

            let zipUrl;
            let pluginStep;
            if (storageMethod === 'r2') {
              const bucketPublicUrl = process.env.CLOUDFLARE_R2_BUCKET_PUBLIC_URL;
              const zipFile = `pr-build-${prNumber}.zip`;
              zipUrl = `${bucketPublicUrl}/${zipFile}`;
              pluginStep = {
                step: "installPlugin",
                pluginData: {
                  resource: "url",
                  url: zipUrl
                }
              };
            } else {
              const branch = `playground-${prNumber}`;
              zipUrl = `https://github.com/${owner}/${repo}/archive/refs/heads/${branch}.zip`;
              pluginStep = {
                step: "installPlugin",
                pluginData: {
                  resource: "git:directory",
                  url: `https://github.com/${owner}/${repo}.git`,
                  ref: branch,
                  refType: "branch"
                },
                options: {
                  targetFolderName: repo
                }
              };
            }

            let landingPage = process.env.LANDING_PAGE?.trim();

            const headRepo = process.env.PR_HEAD_REPO || context.payload.pull_request?.head?.repo?.full_name || `${owner}/${repo}`;
            const headSha = process.env.PR_HEAD_SHA || context.payload.pull_request?.head?.sha;
            const prBranch = process.env.PR_HEAD_REF || context.payload.pull_request?.head?.ref || headSha;

            const demoContentPath = path.resolve(process.env.GITHUB_WORKSPACE || '.', '_playground', 'demo-content.xml');
            const hasDemoContent = fs.existsSync(demoContentPath);

            if (!hasDemoContent && (!landingPage || landingPage === '/wp-admin/post.php?post=4&action=edit')) {
              landingPage = '/wp-admin/';
            }

            const steps = [
              {
                step: "updateUserMeta",
                meta: {
                  admin_color: "modern",
                  show_welcome_panel: 0
                },
                userId: 1
              },
              {
                step: "setSiteOptions",
                options: { blogname: `${owner}/${repo} - PR ${prNumber}` }
              },
              pluginStep
            ];

            if (hasDemoContent) {
              const demoRef = headSha || encodeURIComponent(prBranch);
              steps.push({
                step: "importWxr",
                file: {
                  resource: "url",
                  url: `https://raw.githubusercontent.com/${headRepo}/${demoRef}/_playground/demo-content.xml`
                }
              });
            }

            const blueprint = {
              $schema: "https://playground.wordpress.net/blueprint-schema.json",
              ...(landingPage ? { landingPage } : {}),
              login: true,
              features: { networking: true },
              steps: steps
            };

            const encoded = Buffer.from(JSON.stringify(blueprint)).toString('base64');
            const previewUrl = `https://playground.wordpress.net/#${encoded}`;

            const startMarker = '<!-- WordPress Playground PR Preview - Start -->';
            const endMarker = '<!-- WordPress Playground PR Preview - End -->';

            const rawMode = (process.env.PREVIEW_MODE || 'description').toLowerCase();
            const appendToPrDescription = rawMode === 'comment' || process.env.APPEND_TO_PR_DESCRIPTION === 'false'
              ? false
              : true;

            const PLAYGROUND_LOGO = 'data%3Aimage%2Fsvg%2Bxml%3Bbase64%2CCjxzdmcgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0ibm9uZSI%%2BPC9zdmc%2B';

            const playgroundBadge = `[![Playground Demo Link](https://img.shields.io/badge/Test%20in%20Playground-3858e9?style=for-the-badge&logo=${PLAYGROUND_LOGO}&logoSize=auto)](${previewUrl})`;
            const downloadBadge = `[![Download Build](https://img.shields.io/badge/Download_Zip-000?style=for-the-badge&logo=googledocs&logoColor=fff)](${zipUrl})`;

            const previewContent = [
              startMarker,
              '-----------',
              '### PR Preview',
              `${playgroundBadge} ${downloadBadge}`,
              '',
              '> [!TIP]',
              '> Playground will be updated with latest preview as you push more changes to this PR.',
              endMarker
            ].join('\n');

            function updateDescription(body, content) {
              const current = body || '';
              const startIndex = current.indexOf(startMarker);
              const endIndex = current.indexOf(endMarker);
              if (startIndex !== -1 && endIndex !== -1 && endIndex >= startIndex) {
                const before = current.substring(0, startIndex).trimEnd();
                const after = current.substring(endIndex + endMarker.length).trimStart();
                return [before, content, after].filter(Boolean).join('\n\n');
              }
              return current.trim() ? `${current.trim()}\n\n${content}` : content;
            }

            function removeDescription(body) {
              const current = body || '';
              const startIndex = current.indexOf(startMarker);
              const endIndex = current.indexOf(endMarker);
              if (startIndex !== -1 && endIndex !== -1 && endIndex >= startIndex) {
                const before = current.substring(0, startIndex).trimEnd();
                const after = current.substring(endIndex + endMarker.length).trimStart();
                return [before, after].filter(Boolean).join('\n\n');
              }
              return current;
            }

            async function updatePrDescription(transform) {
              const maxRetries = 3;
              for (let attempt = 0; attempt < maxRetries; attempt++) {
                const { data: latestPr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                const currentBody = latestPr.body || '';
                const newBody = transform(currentBody);
                if (newBody === currentBody) {
                  return;
                }
                try {
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: prNumber,
                    body: newBody,
                  });
                  return;
                } catch (error) {
                  if (attempt === maxRetries - 1) throw error;
                }
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
            });

            const previewComments = comments.filter(c =>
              c.user?.type === 'Bot' && c.body && c.body.includes('<!-- WordPress Playground PR Preview')
            );

            if (appendToPrDescription) {
              await updatePrDescription(body => updateDescription(body, previewContent));

              for (const comment of previewComments) {
                try {
                  await github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: comment.id,
                  });
                } catch (_) {}
              }
            } else {
              if (previewComments.length > 0) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: previewComments[0].id,
                  body: previewContent,
                });
                for (const extra of previewComments.slice(1)) {
                  try {
                    await github.rest.issues.deleteComment({
                      owner,
                      repo,
                      comment_id: extra.id,
                    });
                  } catch (_) {}
                }
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: previewContent,
                });
              }

              await updatePrDescription(body => removeDescription(body));
            }

  cleanup:
    if: github.event.action == 'closed'
    name: Cleanup Preview Resources
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup preview comment and description
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const startMarker = '<!-- WordPress Playground PR Preview - Start -->';
            const endMarker = '<!-- WordPress Playground PR Preview - End -->';

            function removeDescription(body) {
              const current = body || '';
              const startIndex = current.indexOf(startMarker);
              const endIndex = current.indexOf(endMarker);
              if (startIndex !== -1 && endIndex !== -1 && endIndex >= startIndex) {
                const before = current.substring(0, startIndex).trimEnd();
                const after = current.substring(endIndex + endMarker.length).trimStart();
                return [before, after].filter(Boolean).join('\n\n');
              }
              return current;
            }

            async function updatePrDescription(transform) {
              const maxRetries = 3;
              for (let attempt = 0; attempt < maxRetries; attempt++) {
                const { data: latestPr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                const currentBody = latestPr.body || '';
                const newBody = transform(currentBody);
                if (newBody === currentBody) {
                  return;
                }
                try {
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: prNumber,
                    body: newBody,
                  });
                  return;
                } catch (error) {
                  if (attempt === maxRetries - 1) throw error;
                }
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
            });

            const previewComments = comments.filter(c =>
              c.user?.type === 'Bot' && c.body && c.body.includes('<!-- WordPress Playground PR Preview')
            );

            for (const comment of previewComments) {
              try {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              } catch (_) {}
            }

            await updatePrDescription(body => removeDescription(body));

      - name: Checkout repository
        if: ${{ !cancelled() && env.STORAGE_METHOD == 'branch' }}
        uses: actions/checkout@v7

      - name: Cleanup branch storage
        if: ${{ !cancelled() && env.STORAGE_METHOD == 'branch' }}
        uses: lubusIN/.github/.github/actions/delete-remote-branch@main
        with:
          target-branch: ${{ env.PR_BUILD_BRANCH }}

      - name: Cleanup R2 storage
        if: ${{ !cancelled() && env.STORAGE_METHOD == 'r2' }}
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto
          aws configure set default.output json
          ENDPOINT="https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="${{ secrets.CLOUDFLARE_R2_BUCKET }}"
          if aws s3api head-object --bucket "$BUCKET" --key "$PR_BUILD_ZIP" --endpoint-url "$ENDPOINT" 2>/dev/null; then
            echo "File exists. Deleting..."
            aws s3 rm "s3://$BUCKET/$PR_BUILD_ZIP" --endpoint-url "$ENDPOINT"
          else
            echo "File does not exist. Nothing to clean up."
          fi
        env:
          AWS_EC2_METADATA_DISABLED: true
